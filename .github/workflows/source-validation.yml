name: Source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mtl-v2:
    name: MTL.V2 build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MTL.V2/src/MTL.Web/package-lock.json

      - name: Restore backend
        run: dotnet restore MTL.V2/MTL.V2.slnx

      - name: Build backend
        run: dotnet build MTL.V2/MTL.V2.slnx -c Release --no-restore

      - name: Test backend
        run: dotnet test MTL.V2/MTL.V2.slnx -c Release --no-build

      - name: Install frontend dependencies
        working-directory: MTL.V2/src/MTL.Web
        run: npm ci

      - name: Build frontend
        working-directory: MTL.V2/src/MTL.Web
        run: npm run build

  app-mtl:
    name: APP.MTL legacy build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore legacy application
        run: dotnet restore APP.MTL/MTL.APP.csproj

      - name: Build legacy application
        run: dotnet build APP.MTL/MTL.APP.csproj -c Release --no-restore

  publish-mtl-v2-images:
    name: Publish MTL.V2 images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mtl-v2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/mtl-v2-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/mtl-v2-web
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: MTL.V2
          file: MTL.V2/deploy/api.Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:main
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mtl-v2-api
          cache-to: type=gha,mode=max,scope=mtl-v2-api

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: MTL.V2
          file: MTL.V2/deploy/web.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:main
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mtl-v2-web
          cache-to: type=gha,mode=max,scope=mtl-v2-web
