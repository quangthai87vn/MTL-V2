name: Source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mtl-v2:
    name: MTL.V2 build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MTL.V2/src/MTL.Web/package-lock.json

      - name: Restore backend
        run: dotnet restore MTL.V2/MTL.V2.slnx

      - name: Build backend
        run: dotnet build MTL.V2/MTL.V2.slnx -c Release --no-restore

      - name: Test backend
        run: dotnet test MTL.V2/MTL.V2.slnx -c Release --no-build

      - name: Install frontend dependencies
        working-directory: MTL.V2/src/MTL.Web
        run: npm ci

      - name: Build frontend
        working-directory: MTL.V2/src/MTL.Web
        run: npm run build

  app-mtl:
    name: APP.MTL legacy build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore legacy application
        run: dotnet restore APP.MTL/MTL.APP.csproj

      - name: Build legacy application
        run: dotnet build APP.MTL/MTL.APP.csproj -c Release --no-restore
