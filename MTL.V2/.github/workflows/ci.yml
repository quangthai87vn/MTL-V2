name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build backend
        run: dotnet build MTL.V2.slnx -c Release

      - name: Test backend
        run: dotnet test MTL.V2.slnx -c Release --no-build

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/MTL.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/MTL.Web
        run: npm ci

      - name: Lint frontend
        working-directory: src/MTL.Web
        run: npm exec eslint .

      - name: Build frontend
        working-directory: src/MTL.Web
        run: npm run build

